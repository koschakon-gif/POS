<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script>(function(){var h=location.hash,c=document.documentElement.classList;if(/^#t[1-6]$/.test(h))c.add('cm');else if(h==='#admin')c.add('am');var q=(location.search.match(/[?&]skin=(\w+)/)||[])[1];document.documentElement.setAttribute('data-skin',q||'arabica')})()</script>
<title>Blue House Café POS v1.9</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+Thai:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F8F6F0;--surf:#FFFFFF;--ink:#202B32;--mute:#69716E;--line:#DFDFD6;--blue:#1849A9;--bink:#FFFFFF;--wood:#1849A9;--free:#2F8F5B;--busy:#B4441F;--soft:#E3EBF5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1420;--surf:#161E2D;--ink:#E9EDF3;--mute:#9AA6B6;--line:#263146;--blue:#7FA6F2;--bink:#0A1630;--wood:#9DBBF6;--free:#4FBF86;--busy:#E8845F;--soft:#1B2A47}}
:root[data-theme="dark"]{--bg:#0E1420;--surf:#161E2D;--ink:#E9EDF3;--mute:#9AA6B6;--line:#263146;--blue:#7FA6F2;--bink:#0A1630;--wood:#9DBBF6;--free:#4FBF86;--busy:#E8845F;--soft:#1B2A47}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",Sarabun,Tahoma,system-ui,sans-serif;font-size:16px;user-select:none;-webkit-user-select:none}
button,input{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--wood);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--bg);color:var(--blue);border-bottom:1px solid var(--line)}
.brand b{font-family:"Playfair Display",Georgia,serif;font-size:22px}
.brand small{margin-left:10px;font-size:13px;opacity:.85}
header button{background:transparent;border:1.5px solid currentColor;border-radius:10px;padding:0 14px;min-height:44px}
main{flex:1;min-height:0;display:grid;grid-template-columns:152px 1fr 370px;gap:10px;padding:10px}
.panel{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--surf);border:1px solid var(--line);border-radius:12px}
#tables{display:grid;gap:8px;padding:10px;align-content:start;overflow:auto}
.tb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-left:6px solid var(--free);border-radius:10px;background:var(--surf)}
.tb.busy{border-left-color:var(--busy)}
.tb.sel{background:var(--soft);outline:2px solid var(--blue)}
.tb span{font-size:14px;color:var(--mute)}
#cats,#cCats{flex:none;display:flex;gap:8px;padding:10px;overflow-x:auto}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surf)}
.chip.on{background:var(--blue);color:var(--bink);border-color:var(--blue)}
#items,#cItems{flex:1;overflow:auto;padding:0 10px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;align-content:start}
.it{position:relative;min-height:86px;padding:10px;text-align:center;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surf);display:flex;flex-direction:column;justify-content:space-between}
.it small{color:var(--wood);font-weight:700;font-size:15px}
.it i{position:absolute;top:6px;right:6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--blue);color:var(--bink);font-style:normal;font-size:14px;line-height:24px;text-align:center}
#billhead{flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
#billhead b{font-size:19px}
.ghost{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent}
#lines{flex:1;overflow:auto;padding:4px 12px}
.ln{display:grid;grid-template-columns:1fr auto 72px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ln small{display:block;color:var(--mute)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surf);font-size:22px}
.qty b{min-width:22px;text-align:center}
.lt{text-align:right;font-weight:600}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
#totals{flex:none;display:grid;gap:8px;padding:12px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{min-height:40px;padding:0 12px}
.net{font-size:30px;font-weight:700}
.go{min-height:58px;border:0;border-radius:12px;background:var(--blue);color:var(--bink);font-size:20px;font-weight:700;width:100%}
.go:disabled{opacity:.4}
.in{width:100%;min-height:54px;padding:0 12px;font-size:24px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#cats select,#cats input,#cCats select,#cCats input{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px}
#cats select,#cCats select{flex:none;font-weight:700}#cats input,#cCats input{flex:1;min-width:0}
input{user-select:text;-webkit-user-select:text}
.hb{display:flex;gap:8px}
#qn{font-style:normal;background:var(--blue);color:var(--bink);border-radius:10px;padding:0 7px;margin-left:6px;font-size:13px}#qn:empty{display:none}
#cust{display:none;flex-direction:column;height:100%}.cm #app{display:none}.cm #cust{display:flex}
#cItems{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));padding-top:10px}
#cBar{flex:none;margin:10px;width:calc(100% - 20px)}
.qrs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.qc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#000}
.qq{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px}
@media (max-width:899px){header{flex-wrap:wrap;gap:6px}header button{padding:0 10px;font-size:14px;min-height:40px}}
@media (min-width:1400px){
 body{font-size:18px}
 main{grid-template-columns:200px 1fr 470px}
 #items{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
 .it{min-height:108px;font-size:18px}.it small{font-size:17px}
 .tb{min-height:80px}.chip{min-height:50px}.go{min-height:68px}.ln{padding:12px 0}
 .qty button{width:48px;height:48px}.net{font-size:34px}
}
#adm{display:none;flex-direction:column;height:100%}.am #app,.am #cust{display:none}.am #adm{display:flex}
#aBody{flex:1;overflow:auto;padding:10px;max-width:760px;width:100%;margin:0 auto}
.ar{display:flex;align-items:center;gap:10px;width:100%;padding:8px;margin-bottom:6px;border:1px solid var(--line);border-radius:10px;background:var(--surf);text-align:left}
.ar .th{flex:none;width:52px;height:52px;border-radius:8px;background:var(--soft);overflow:hidden}
.ar .th img,.ph2 img{width:100%;height:100%;object-fit:cover;display:block}
.ar .nm{flex:1}.ar b{color:var(--wood)}
.ah{margin:14px 0 6px;color:var(--mute);font-weight:700}
.ph2{height:160px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--mute);overflow:hidden;margin:10px 0}
.fl{display:inline-flex;align-items:center;cursor:pointer}
.sheet .in{margin:6px 0;font-size:17px}
.it.im{padding:0;overflow:hidden;justify-content:flex-end;min-height:124px;color:#fff}
.it.im .ph{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.it.im span,.it.im small{position:relative;width:100%;padding:3px 8px;background:rgba(10,20,28,.62);color:#fff}
.it.im i{z-index:2}
@media (min-width:1400px){.it.im{min-height:150px}}
.brand{display:flex;align-items:center;gap:11px;color:var(--blue)}
.logo-icon{width:36px;height:37px;display:grid;place-items:center;background:var(--blue);color:var(--bg);clip-path:polygon(50% 0,100% 30%,100% 100%,0 100%,0 30%);font:700 22px Georgia,"Times New Roman",serif;padding-top:6px}
.logo-text{font-size:17px;font-weight:800;line-height:1.15;letter-spacing:1px}
.logo-text small{display:block;margin:5px 0 0;font-size:9px;font-weight:700;letter-spacing:3px;opacity:1}
.panel,.ar{border-radius:6px}.it,.tb{border-radius:6px}.go,.ghost,.in{border-radius:4px}.go{font-weight:700}
.sheet{border-radius:8px 8px 0 0}
@media (min-width:900px){.sheet{border-radius:8px}}
.ah{color:var(--blue);font-size:12px;letter-spacing:2px;text-transform:uppercase}
button:focus-visible,input:focus-visible{outline:3px solid #DC9D35;outline-offset:2px}
.logo-text{white-space:nowrap}
.sheet>button.go:last-child{position:sticky;bottom:0}
.chip:disabled{opacity:.4}
#custbar{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
#custbar .cn{flex:1;min-width:0}
.ar small{color:var(--mute);font-weight:400}
.kpi{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0;color:var(--mute);font-size:14px}.kpi b{color:var(--ink)}
.hb .shopb{color:var(--free)}.hb .shopb.off{color:var(--busy)}
.closed{flex:none;background:var(--busy);color:#fff;text-align:center;padding:10px;font-weight:700}
.dg{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.dg>b{flex:none;width:22px;text-align:center}.dg.ok>b{color:var(--free)}.dg.warn>b{color:#B7791F}.dg.bad>b{color:var(--busy)}
.dg small{display:block;color:var(--mute)}
.okbar,#aBody .closed{margin:8px 0;padding:10px;text-align:center;font-weight:700;border-radius:4px}
.okbar{background:var(--free);color:#fff}
.logo-text{text-transform:uppercase}.logo-text small{text-transform:none}
/* ===== ธีม Arabica (เรียบ ขาว-ดำ เส้นบาง มุมเหลี่ยม) เปิดค่าเริ่มต้น ดูธีม Blue House ได้ที่ ?skin=bluehouse ===== */
:root[data-skin="arabica"]{--bg:#FFFFFF;--surf:#FFFFFF;--ink:#111111;--mute:#6B6B6B;--line:#E5E5E5;--blue:#111111;--bink:#FFFFFF;--wood:#111111;--free:#3A7D5C;--busy:#B3412E;--soft:#F5F5F5}
@media (prefers-color-scheme:dark){:root[data-skin="arabica"]:not([data-theme="light"]){--bg:#0B0B0B;--surf:#141414;--ink:#F2F2F2;--mute:#9A9A9A;--line:#2A2A2A;--blue:#F2F2F2;--bink:#111111;--wood:#F2F2F2;--free:#5BBF92;--busy:#E8845F;--soft:#1C1C1C}}
[data-skin="arabica"] body{font-family:Inter,"Noto Sans Thai",Tahoma,system-ui,sans-serif}
[data-skin="arabica"] .brand{color:var(--ink)}
[data-skin="arabica"] .logo-icon{width:auto;height:auto;background:none;clip-path:none;padding:0;color:var(--ink);font:300 0/1 Inter,sans-serif}
[data-skin="arabica"] .logo-icon::before{content:"%";font:300 30px/1 Inter,sans-serif}
[data-skin="arabica"] .logo-text{text-transform:none;font-size:22px;font-weight:600;letter-spacing:-.5px}
[data-skin="arabica"] .logo-text small{font-size:10px;font-weight:400;letter-spacing:2px;text-transform:uppercase;color:var(--mute);margin-top:2px}
[data-skin="arabica"] header{background:var(--bg);color:var(--ink)}
[data-skin="arabica"] header button{border:1px solid var(--ink);color:var(--ink);border-radius:0}
[data-skin="arabica"] .hb .shopb{color:var(--free);border-color:var(--free)}
[data-skin="arabica"] .hb .shopb.off{color:var(--busy);border-color:var(--busy)}
[data-skin="arabica"] .panel,[data-skin="arabica"] .ar,[data-skin="arabica"] .it,[data-skin="arabica"] .tb,[data-skin="arabica"] .go,[data-skin="arabica"] .ghost,[data-skin="arabica"] .in,[data-skin="arabica"] .chip,[data-skin="arabica"] .qc,[data-skin="arabica"] .ph2,[data-skin="arabica"] .qty button,[data-skin="arabica"] .okbar,[data-skin="arabica"] #cats select,[data-skin="arabica"] #cats input,[data-skin="arabica"] #cCats select,[data-skin="arabica"] #cCats input{border-radius:0}
[data-skin="arabica"] .sheet{border-radius:0}
[data-skin="arabica"] .it small{color:var(--mute);font-weight:400}
[data-skin="arabica"] .it.im span,[data-skin="arabica"] .it.im small{color:#fff}
[data-skin="arabica"] .tb{border-left-width:3px}
[data-skin="arabica"] .go{font-weight:600}
[data-skin="arabica"] #tabs .on{color:var(--ink);box-shadow:inset 0 2px var(--ink)}
[data-skin="arabica"] .ah{color:var(--mute);letter-spacing:2px}
.it i{top:auto;bottom:6px;right:6px}
.lnb{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;width:100%}
#items,#cItems{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:max-content;gap:10px}
.it.fr .ph,.it.fr .nm,.it.fr small{flex:none}
.it.fr{padding:0;align-items:stretch;justify-content:flex-start;text-align:left;overflow:hidden;min-height:0}
.it.fr .ph{position:relative;display:block;width:100%;height:112px;background:var(--soft);overflow:hidden}
@media (min-width:900px){.it.fr .ph{height:124px}}
@media (min-width:1400px){.it.fr .ph{height:150px}}
.it.fr .ph img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.it.fr .pl{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font:300 38px Inter,sans-serif;color:var(--mute);opacity:.35}
.it.fr .nm{display:block;padding:8px 10px 0;font-weight:600;font-size:15px;line-height:1.25}
.it.fr small{padding:2px 10px 10px;color:var(--mute);font-weight:500;font-size:14px;text-align:left}
.it.fr i{top:6px;right:6px;bottom:auto}
@media (min-width:1400px){#items{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}.it.fr .nm{font-size:17px}.it.fr small{font-size:16px}}
.hero{flex:none;position:relative;min-height:116px;display:flex;align-items:flex-end;padding:16px;background:var(--soft);border-bottom:1px solid var(--line);overflow:hidden}
.hero.hb2{background-size:cover;background-position:center;color:#fff}
.hero.hb2::before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(rgba(0,0,0,.05),rgba(0,0,0,.65))}
.hi{position:relative;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.hn{font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1.15}
.ht{font-size:14px}.hh{font-size:12px;opacity:.85}
.hs{margin-top:6px;padding:2px 10px;border:1px solid currentColor;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.kpis>div{border:1px solid var(--line);padding:10px}.kpis small{display:block;color:var(--mute)}.kpis b{display:block;font-size:22px}.kpis em{font-style:normal;font-size:13px;color:var(--mute)}
.kpis em.up{color:var(--free)}.kpis em.dn{color:var(--busy)}
.brow{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.bar{height:5px;background:var(--soft)}.bar>i{display:block;height:100%;background:var(--ink)}
svg.ch{margin:10px 0}svg.ch rect{fill:var(--ink)}svg.ch text{fill:var(--mute);font-size:9px}
#prt{display:none}
@media print{body.printing>*:not(#prt){display:none!important}body.printing>#prt{display:block!important}}
@media print{body>*:not(#modal){display:none!important}.ov{position:static;display:block;background:none}.sheet{max-width:none;max-height:none;overflow:visible;padding:0;background:#fff}.sheet>*:not(.qrs){display:none}}
.dine{padding:8px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go.alt{background:transparent;color:var(--blue);border:2px solid var(--blue)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#tabs{display:none;flex:none;background:var(--surf);border-top:1px solid var(--line)}
#tabs button{flex:1;min-height:58px;border:0;background:transparent;font-size:16px}
#tabs .on{color:var(--blue);font-weight:700;box-shadow:inset 0 3px var(--blue)}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surf);border-radius:16px 16px 0 0}
.sheet p{margin:8px 0;color:var(--mute)}
.rc{display:flex;justify-content:space-between;padding:4px 0}
.hr{border-top:1px dashed var(--line);margin:8px 0}
@media (min-width:900px){.ov{align-items:center}.sheet{border-radius:16px}}
@media (max-width:899px){
 main{grid-template-columns:1fr}
 .panel:not(.on){display:none}
 #tabs{display:flex}
 #tables{grid-template-columns:repeat(2,1fr)}
 #items{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
</style>
</head>
<body>
<div id="app">
 <header><div class="brand"><span class="logo-icon" aria-hidden="true">b</span><span class="logo-text"><span class="sn">Blue House</span><small>POS v1.9</small></span></div><div class="hb"><button id="bShop" class="shopb">● ร้านเปิด</button><button id="bQr">ออเดอร์ QR<i id="qn"></i></button><button id="bGen">QR โต๊ะ</button><button id="bSum">ยอดวันนี้</button><button id="bAdm">จัดการเมนู</button></div></header>
 <main>
  <section class="panel" id="p-tables"><div id="tables"></div></section>
  <section class="panel" id="p-menu"><div id="cats"><select id="catSel" aria-label="หมวด"></select><input id="q" type="search" placeholder="ค้นหาเมนู"></div><div id="items"></div></section>
  <section class="panel" id="p-bill"><div id="billhead"></div><div id="custbar"></div><div id="lines"></div><div id="totals"></div></section>
 </main>
 <nav id="tabs"><button data-p="tables">โต๊ะ</button><button data-p="menu">เมนู</button><button data-p="bill">บิล</button></nav>
 </div>
<div id="cust"><header><div class="brand"><span class="logo-icon" aria-hidden="true">b</span><span class="logo-text"><span class="sn">Blue House</span><small>COFFEE &amp; COMMUNITY</small></span></div><b id="cT"></b></header>
 <div id="cHero"></div><div id="cCats"><select id="cSel" aria-label="หมวด"></select><input id="cQ" type="search" placeholder="ค้นหาเมนู"></div>
 <div id="cNote"></div><div id="cItems"></div><button class="go" id="cBar" disabled></button></div>
<div id="adm"><header><div class="brand"><span class="logo-icon" aria-hidden="true">b</span><span class="logo-text"><span class="sn">Blue House</span><small>จัดการเมนู</small></span></div><button id="aBack">กลับ POS</button></header><div id="aBody"></div></div>
<div id="toast"></div><div id="modal"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ===== เมนูตัวอย่าง: แก้ชื่อ/ราคาตรงนี้ได้เลย [หมวด, ชื่อ, ราคา] =====
const POINT_DISC=80; // แลกแต้มฟรี = ลดกี่บาท
// กติกาแต้ม: ทุก ฿per ที่จ่ายสุทธิ = 1 แต้ม / ครบ redeem แต้ม แลกฟรี 1 แก้ว (ไม่เกิน ฿POINT_DISC) หรือลด ฿POINT_DISC
// track:false = แต้มสะสมในไลน์ของร้าน POS ไม่เก็บยอดแต้ม (แค่แจ้งว่าบิลนี้ได้กี่แต้ม และมีปุ่มแลก)  track:true = POS เก็บยอดแต้มของสมาชิกเอง
const LOYALTY={per:100,redeem:10,track:false};

function add(t,id,d,m,ty,ex){
 const a=S.orders[t]=S.orders[t]||[], l=a.find(x=>x.id===id&&(x.m||'')===(m||'')&&(x.ty||'')===(ty||'')&&exKey(x.ex)===exKey(ex));
 if(l){l.q+=d;if((l.pq||0)>l.q)l.pq=Math.max(0,l.q);if(l.q<=0)a.splice(a.indexOf(l),1)}else if(d>0)a.push({id,q:d,m:m||'',ty:ty||'',ex:(ex||[]).slice().sort()});
 if(!a.length){delete S.orders[t];delete S.disc[t];if(S.dine)delete S.dine[t];if(S.open)delete S.open[t];if(S.pts)delete S.pts[t];if(S.cust)delete S.cust[t]}
 save();render();
}

function pick(id,cb,ed){
 const m=MI(id),ks=m.v?['h','i','b'].filter(k=>m.v[k]!=null):[],ad=isAdd(m),aos=ad?[]:MENU.filter(isAdd);
 let s=ed?(ed.m||''):'ปกติ',ty=ed?(ed.ty||''):(ks.length?(ks.indexOf('i')>=0?'i':ks[0]):''),ex=ed?(ed.ex||[]).slice():[];
 const done=()=>{const e=ex.slice().sort();if(cb)cb(id,ad?'':s,ty,e);else add(cur,id,1,ad?'':s,ty,e)};
 if(ad&&ks.length<2&&!ed){done();return}
 const draw=()=>{
  modal(`<div class="row"><b>${m.n}</b><button class="ghost" id="x">ปิด</button></div>${ks.length>1?'<p>ประเภท</p><div class="chips">'+ks.map(k=>`<button class="chip ${k===ty?'on':''}" data-ty="${k}">${TY[k]} ${fmt(m.v[k])}</button>`).join('')+'</div>':''}${ad?'':'<p>ความหวาน</p><div class="chips">'+SWEET.map(v=>`<button class="chip ${v===s?'on':''}" data-s="${v}">${v}</button>`).join('')+'</div>'}${aos.length?'<p>ส่วนเพิ่ม (เฉพาะแก้วนี้)</p><div class="chips">'+aos.map(a=>`<button class="chip ${ex.indexOf(a.id)>=0?'on':''}" data-ex="${esc(a.id)}">${a.n} +${fmt(a.p)}</button>`).join('')+'</div>':''}<button class="go" id="ok" style="margin-top:16px">${ed?'บันทึกแก้วนี้':'เพิ่มลงบิล'} · ${fmt(upr(m,ty)+exSum(ex))}</button>`);
  $('#x').onclick=()=>modal('');
  $$('[data-ty]').forEach(b=>b.onclick=()=>{ty=b.dataset.ty;draw()});
  $$('[data-s]').forEach(b=>b.onclick=()=>{s=b.dataset.s;draw()});
  $$('[data-ex]').forEach(b=>b.onclick=()=>{const k=b.dataset.ex,i=ex.indexOf(k);if(i>=0)ex.splice(i,1);else ex.push(k);draw()});
  $('#ok').onclick=()=>{done();modal('')};
 };
 draw();
}
function editCup(k){const l=L(cur)[k];if(!l)return;pick(l.id,(id,s,ty,ex)=>{add(cur,id,1,s,ty,ex);add(cur,l.id,-1,l.m,l.ty,l.ex)},l)}

function render(){
 $('#tables').innerHTML=TB.map(t=>`<button class="tb ${t===cur?'sel':''} ${cnt(t)?'busy':''}" data-t="${t}"><b>${tname(t)}</b><span>${cnt(t)?fmt(tot(t)):'ว่าง'}</span></button>`).join('');

 $('#items').innerHTML=MENU.filter(m=>qs?m.n.toLowerCase().includes(qs):(cat<0||m.c===cat)).map(m=>tile(m,'data-i',mine[m.id])).join('');
 const ls=L(cur), n=tot(cur), pt=!!(S.pts&&S.pts[cur]), pc=S.disc[cur]||0;
 $('#billhead').innerHTML=`<b>${tname(cur)}</b><button class="ghost" id="bClr" ${ls.length?'':'disabled'}>ล้างบิล</button>`;

 $('#custbar').innerHTML=(cu?`<span class="cn"><b>${esc(cu.name||'สมาชิก')}</b> · ${esc(cu.phone)}${LOYALTY.track?' · ⭐ '+(cu.points||0)+' แต้ม':''}</span><button class="ghost" data-cx="1">เอาออก</button>`:'<button class="chip" data-cu="1">+ สมาชิก / ค้นหาลูกค้า</button>')+'<button class="chip" data-pr="1">พิมพ์'+(pn?' ('+pn+')':'')+'</button>';
 $('#lines').innerHTML=ls.length?`<div class="dine chips">${[['in','เสริฟในร้าน'],['take','กลับบ้าน']].map(([k,v])=>`<button class="chip ${dine(cur)===k?'on':''}" data-dn="${k}">${v}</button>`).join('')}</div>`+ls.map((l,k)=>{const m=MI(l.id);return `<div class="ln"><div><button class="lnb" data-ed="${k}">${m.n}<small>${l.ty?TY[l.ty]+' · ':''}${l.m?l.m+' · ':''}${l.ex&&l.ex.length?'+ '+exTxt(l.ex)+' · ':''}${fmt(lp(l))}</small></button></div><div class="qty"><button data-a="-1" data-k="${k}" aria-label="ลด">−</button><b>${l.q}</b><button data-a="1" data-k="${k}" aria-label="เพิ่ม">+</button></div><div class="lt">${fmt(lp(l)*l.q)}</div></div>`}).join(''):'<div class="empty">ยังไม่มีรายการ แตะเมนูเพื่อเพิ่ม</div>';
 $('#totals').innerHTML=`<div class="row"><span>รวม</span><span>${fmt(sub(cur))}</span></div>
 <div class="row"><span>ส่วนลด${dsc(cur)?' −'+fmt(dsc(cur)):''}</span><div class="chips"><button class="chip ${pt?'on':''}" data-pt="1" ${sub(cur)?'':'disabled'}>แลกแต้มฟรี −${fmt(POINT_DISC)}</button><button class="chip ${showDisc||pc?'on':''}" data-more="1">อื่นๆ ${showDisc?'▴':'▾'}</button></div></div>
 ${showDisc||pc?`<div class="row"><span></span><div class="chips">${[0,5,10,20].map(d=>`<button class="chip ${!pt&&pc===d?'on':''}" data-d="${d}">${d?d+'%':'ไม่มี'}</button>`).join('')}</div></div>`:''}
 <div class="row"><span>สุทธิ</span><span class="net">${fmt(n)}</span></div>
 <div class="row2"><button class="go" id="bSave" ${sub(cur)?'':'disabled'}>${S.open&&S.open[cur]?'บันทึก':'เปิดตั๋ว'}</button><button class="go alt" id="bPay" ${sub(cur)?'':'disabled'}>ชำระเงิน</button></div>`;

}

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){cur=b.dataset.t;setTab('menu');render()}

function pay(){
 const t=cur,n=tot(t);if(!sub(t))return;
 let m='cash',got=n;
 const M={cash:'เงินสด',pp:'PromptPay',card:'บัตร'};
 const upd=()=>{const c=$('#chg');if(!c)return;const ok=got>=n;c.textContent=ok?'เงินทอน '+fmt(got-n):'ยังขาด '+fmt(n-got);$('#ok').disabled=!ok};
 const draw=()=>{
  modal(`<div class="row"><b>ชำระเงิน · ${tname(t)}</b><button class="ghost" id="x">ปิด</button></div>
  <div class="net" style="text-align:center;margin:12px 0">${fmt(n)}</div>
  <div class="chips">${Object.keys(M).map(k=>`<button class="chip ${k===m?'on':''}" data-m="${k}">${M[k]}</button>`).join('')}</div>
  <div style="margin:14px 0">${m==='cash'?`<input class="in" id="got" type="number" inputmode="numeric" value="${got}"><div class="chips" style="margin-top:8px">${[n,100,500,1000].map((v,i)=>`<button class="chip" data-q="${v}">${i?fmt(v):'ตรงยอด'}</button>`).join('')}</div><p id="chg"></p>`:m==='pp'?'<p>ให้ลูกค้าสแกน PromptPay ของร้าน แล้วกดยืนยันเมื่อเงินเข้า</p>':'<p>รูดบัตรที่เครื่อง EDC แล้วกดยืนยันเมื่อรายการผ่าน</p>'}</div>
  <button class="go" id="ok">ยืนยันรับเงิน</button>`);
  $('#x').onclick=()=>modal('');
  $$('[data-m]').forEach(b=>b.onclick=()=>{m=b.dataset.m;got=n;draw()});
  if(m==='cash'){
   $('#got').oninput=e=>{got=+e.target.value||0;upd()};
   $$('[data-q]').forEach(b=>b.onclick=()=>{got=+b.dataset.q;$('#got').value=got;upd()});
   upd();
  }
  $('#ok').onclick=()=>{
   const cu0=S.cust&&S.cust[t],ep=Math.floor(n/LOYALTY.per),up=LOYALTY.track&&cu0&&S.pts&&S.pts[t]===true?LOYALTY.redeem:0;
   const bill={no:S.seq++,ts:new Date().toISOString(),cid:cu0?cu0.id:null,cn:cu0?cu0.name:'',cph:cu0?cu0.phone:'',ep,up,bal:LOYALTY.track&&cu0?(cu0.points||0)+ep-up:null,t:tname(t),dn:dine(t),d:today(),h:hhmm(),items:L(t).map(l=>({n:MI(l.id).n,p:lp(l),q:l.q,s:l.m,ty:l.ty||'',x:exTxt(l.ex)})),sub:sub(t),dc:dsc(t),pk:!!(S.pts&&S.pts[t]),total:n,m,got:m==='cash'?got:n};
   S.bills.push(bill);if(S.bills.length>300)S.bills.shift();queueBill(bill);if(cu0)queueApply(cu0.id,LOYALTY.track?ep-up:0,n);
   delete S.orders[t];delete S.disc[t];if(S.dine)delete S.dine[t];if(S.open)delete S.open[t];if(S.pts)delete S.pts[t];if(S.cust)delete S.cust[t];save();render();receipt(bill,true);
  };
 };
 draw();
}

function receipt(b,auto){
 modal(`<div class="row"><b>ใบเสร็จ #${no4(b.no)}</b><span>${b.t} · ${b.h}</span></div><div class="rc"><span>${b.dn==='take'?'กลับบ้าน':'เสริฟในร้าน'}</span></div><div class="hr"></div>

function docCanvas(lines,W){
 const sc=W/384,c=document.createElement('canvas'),x=c.getContext('2d'),pad=Math.round(6*sc),ops=[];let y=pad;
 const mk=(sz,b)=>(b?'bold ':'')+Math.round(sz*sc)+'px '+PFONT;
 const wrap=(s,font,maxW)=>{x.font=font;const out=[];let cur='';Array.from(String(s)).forEach(ch=>{if(x.measureText(cur+ch).width>maxW&&cur){out.push(cur);cur=ch}else cur+=ch});if(cur)out.push(cur);return out.length?out:['']};
 lines.forEach(L=>{
  if(L.t==='sep'){y+=Math.round(4*sc);ops.push({k:'sep',y});y+=Math.round(8*sc);return}
  if(L.t==='gap'){y+=Math.round((L.h||8)*sc);return}
  const sz=L.sz||22,font=mk(sz,L.b),lh=Math.round(sz*sc*1.35),ind=L.ind?Math.round(L.ind*sc):0;
  if(L.t==='row'){x.font=font;const rw=Math.ceil(x.measureText(L.r).width)+Math.round(8*sc);wrap(L.l,font,W-2*pad-rw-ind).forEach((s,i)=>{ops.push({k:'t',s,font,x:pad+ind,y,al:'l'});if(i===0&&L.r!=='')ops.push({k:'t',s:L.r,font,x:W-pad,y,al:'r'});y+=lh});return}
  const al=L.al||'l';wrap(L.s,font,W-2*pad-ind).forEach(s=>{ops.push({k:'t',s,font,x:al==='c'?W/2:al==='r'?W-pad:pad+ind,y,al});y+=lh});
 });
 y+=pad;c.width=W;c.height=Math.max(y,40);
 x.fillStyle='#fff';x.fillRect(0,0,W,c.height);x.fillStyle='#000';x.textBaseline='top';
 ops.forEach(o=>{if(o.k==='sep')x.fillRect(pad,o.y,W-2*pad,Math.max(1,Math.round(sc)));else{x.font=o.font;x.textAlign=o.al==='c'?'center':o.al==='r'?'right':'left';x.fillText(o.s,o.x,o.y)}});

}
function escposBytes(c,o){
 const W=c.width,H=c.height,d=c.getContext('2d').getImageData(0,0,W,H).data,bpr=Math.ceil(W/8);
 const bit=(px,py)=>{if(px>=W||py>=H)return 0;const i=(py*W+px)*4;return(d[i]*.299+d[i+1]*.587+d[i+2]*.114)<150?1:0};
 const out=[0x1B,0x40];
 if(o.mode==='esc'){
  out.push(0x1B,0x33,24);
  for(let y0=0;y0<H;y0+=24){out.push(0x1B,0x2A,33,W&255,W>>8);for(let px=0;px<W;px++)for(let k=0;k<3;k++){let v=0;for(let b=0;b<8;b++)v=(v<<1)|bit(px,y0+k*8+b);out.push(v)}out.push(0x0A)}
  out.push(0x1B,0x32);
 }else{
  for(let y0=0;y0<H;y0+=128){const hh=Math.min(128,H-y0);out.push(0x1D,0x76,0x30,0,bpr&255,bpr>>8,hh&255,hh>>8);for(let y=0;y<hh;y++)for(let bx=0;bx<bpr;bx++){let v=0;for(let b=0;b<8;b++)v=(v<<1)|bit(bx*8+b,y0+y);out.push(v)}}
 }

}

function repWin(per,now){
 const y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
 if(per==='7'||per==='30'){const n=+per;return{gran:'day',n,cs:new Date(y,m,d+1-n),ce:new Date(y,m,d+1),ps:new Date(y,m,d+1-2*n),pe:new Date(y,m,d+1-n),label:n+' วันล่าสุด'}}

}
function repAgg(rows,from,to,gran,n){
 const B=[];for(let i=0;i<n;i++)B.push({rev:0,n:0});
 const T={rev:0,n:0,dc:0,pk:0,m:{cash:0,pp:0,card:0},items:{},cats:{},list:[],B};
 const seen={};
 rows.forEach(r=>{
  const t=new Date(r.created_at);if(!(t>=from&&t<to))return;
  const d=r.data||{},k=(d.no||'')+'|'+(d.d||'')+'|'+(d.h||'')+'|'+r.total;if(seen[k])return;seen[k]=1;
  const tot=+r.total||0,i=gran==='day'?Math.round((new Date(t.getFullYear(),t.getMonth(),t.getDate())-from)/864e5):(t.getFullYear()-from.getFullYear())*12+t.getMonth()-from.getMonth();
  if(B[i]){B[i].rev+=tot;B[i].n++}
  T.rev+=tot;T.n++;T.dc+=+d.dc||0;if(d.pk)T.pk++;
  if(T.m[d.m]!=null)T.m[d.m]+=tot;
  (d.items||[]).forEach(it=>{const q=+it.q||0,v=(+it.p||0)*q,x=T.items[it.n]=T.items[it.n]||{q:0,rev:0};x.q+=q;x.rev+=v;const mm=MENU.find(z=>z.n===it.n),c=mm?CATS[mm.c]:'อื่นๆ';T.cats[c]=(T.cats[c]||0)+v});
  T.list.push({t,tot,d});
 });
 return T;
}

  <input class="in" id="cp" type="tel" inputmode="numeric" placeholder="เบอร์โทรสะสมแต้ม (ไม่บังคับ)" value="${esc(cinfo.ph)}"><input class="in" id="cn" placeholder="ชื่อ (ไม่บังคับ)" value="${esc(cinfo.nm)}">
  <label class="rc"><span>ยินยอมให้ร้านเก็บชื่อและเบอร์โทรเพื่อสะสมแต้มและส่งโปรโมชัน</span><input id="cc" type="checkbox" ${cinfo.cs?'checked':''}></label><div class="row"><span>รวม</span><b class="net">${fmt(ctot())}</b></div><p>ชำระเงินที่เคาน์เตอร์</p><button class="go" id="snd">ส่งออเดอร์</button>`);
  $('#x').onclick=()=>modal('');
  $('#nt').oninput=e=>note=e.target.value.slice(0,120);
  const keep=()=>{cinfo={ph:$('#cp').value,nm:clr($('#cn').value),cs:$('#cc').checked};try{localStorage.setItem('bhc_cinfo',JSON.stringify(cinfo))}catch(x){}};
  ['#cp','#cn'].forEach(s=>$(s).oninput=keep);$('#cc').onchange=keep;
  $$('[data-ek]').forEach(b=>b.onclick=()=>{const l=cart[+b.dataset.ek];pick(l.id,(id,s,ty,ex)=>{cartAdd(id,s,1,ty,ex);cartAdd(l.id,l.m,-1,l.ty,l.ex);setTimeout(cartView,0)},l)});
  $$('[data-ck]').forEach(b=>b.onclick=()=>{const l=cart[+b.dataset.ck];cartAdd(l.id,l.m,+b.dataset.cd,l.ty,l.ex);draw()});
  $('#snd').onclick=async()=>{
   await shopChk();if(CLOSED){toast('ร้านปิดอยู่ตอนนี้');modal('');return}
   keep();const ph=normPhone(cinfo.ph);if(ph&&(!okPhone(ph)||!cinfo.cs)){toast(!okPhone(ph)?'เบอร์โทรไม่ถูกต้อง':'กรุณาติ๊กยินยอมก่อน');return}
   const o={id:uid(),table_no:+TNO,items:cart.map(l=>({id:l.id,n:MI(l.id).n,p:lp(l),q:l.q,s:l.m,ty:l.ty||'',ex:l.ex||[]})),note,total:ctot(),status:'new',created_at:new Date().toISOString()};if(ph){o.cust_phone=ph;o.cust_name=cinfo.nm;o.cust_consent=true}
   $('#snd').disabled=true;
   try{await DB.send(o)}catch(e){$('#snd').disabled=false;await shopChk();toast(CLOSED?'ร้านปิดอยู่ตอนนี้':'ส่งไม่สำเร็จ ลองอีกครั้ง');if(CLOSED)modal('');return}
   cart=[];note='';cRender();sent(o.id);
  };
 };
 draw();
}
function sent(id){
 const msg={new:'ส่งออเดอร์แล้ว รอร้านยืนยัน…',accepted:'ร้านรับออเดอร์แล้ว กำลังเตรียมเครื่องดื่ม',rejected:'ขออภัย ร้านรับออเดอร์นี้ไม่ได้ กรุณาเรียกพนักงาน'};
 let h;
 const draw=s=>{modal(`<b>ออเดอร์ #${id.slice(0,4).toUpperCase()} · โต๊ะ ${TNO}</b><p>${msg[s]||msg.new}</p><button class="go" id="more">สั่งเพิ่ม</button>`);$('#more').onclick=()=>{clearInterval(h);modal('')}};
 draw('new');
 h=setInterval(async()=>{try{const s=await DB.status(id);if(s&&s!=='new'){clearInterval(h);draw(s)}}catch(e){}},4000);
 setTimeout(()=>clearInterval(h),1800000);
}
// จุดเชื่อม QR order: POS.addOrder('3',[['ลาเต้',2],['บราวนี่',1]])
window.POS={version:'0.7',addOrder(t,items){(items||[]).forEach(([n,q])=>{const m=MENU.find(x=>x.n===n);if(m&&TB.includes(String(t)))add(String(t),m.id,q||1)})}};

function boot(){
addEventListener('hashchange',()=>location.reload());
paintProfile();
$('#catSel').innerHTML=['รายการทั้งหมด'].concat(CATS).map((c,i)=>`<option value="${i-1}">${c}</option>`).join('');
$('#catSel').onchange=e=>{cat=+e.target.value;qs='';$('#q').value='';render()};
$('#q').oninput=e=>{qs=e.target.value.trim().toLowerCase();render()};
setTab('menu');render();
if(TNO){
 $('#cT').textContent='โต๊ะ '+TNO;
 $('#cSel').innerHTML=['รายการทั้งหมด'].concat(CATS).map((c,i)=>`<option value="${i-1}">${c}</option>`).join('');
 $('#cSel').onchange=e=>{cc=+e.target.value;cq='';$('#cQ').value='';cRender()};
 $('#cQ').oninput=e=>{cq=e.target.value.trim().toLowerCase();cRender()};
 $('#cust').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.ci)pick(b.dataset.ci,(id,s,ty,ex)=>cartAdd(id,s,1,ty,ex));else if(b.id==='cBar')cartView()});
 cRender();shopChk();setInterval(shopChk,30000);
 addEventListener('hashchange',()=>location.reload());
}else if(ADM){adminInit()}else{poll();setInterval(poll,4000);setInterval(()=>{if(QN.length&&!document.hidden)beep()},15000);wl()}
}
Promise.race([loadMenu(),new Promise(r=>setTimeout(r,4000))]).then(boot);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
